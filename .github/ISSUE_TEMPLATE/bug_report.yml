name: 🐛 Relatar um problema / Bug Report
description: Relate um problema (fecha sozinho, corta errado, não instala…) / Report a problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por relatar! Preencha o máximo que puder, e se tiver a mensagem de erro, cole o texto exato — assim quem pesquisar pelo mesmo erro também encontra a resposta.
        Thanks for reporting! Please paste the exact error text if you have one.
  - type: input
    id: version
    attributes:
      label: Versão do HotClip / Version
      placeholder: por exemplo v0.4.3 (aparece em "Configurações" ou no nome do arquivo de instalação)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Sistema operacional / OS
      options:
        - Windows 10
        - Windows 11
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
        - Outro / Other
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Em que etapa aconteceu / Which stage
      options:
        - Instalação e abertura / Install & launch
        - Importação / Import
        - Transcrição / Transcription
        - Busca de destaques pela IA / Highlight detection
        - Exportação / Export
        - Outra / Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: O que aconteceu / What happened
      description: O que você fez, o que esperava ver e o que viu de fato. Se apareceu um erro, cole o **texto completo**; com captura de tela fica melhor ainda.
      placeholder: |
        1. Importei uma gravação de live em FLV de 2 horas
        2. Escolhi o motor SenseVoice e cliquei em começar
        3. Aos 40% deu erro: (cole o erro completo aqui)
    validations:
      required: true
  - type: textarea
    id: media-info
    attributes:
      label: Informações do material / Source media (opcional)
      description: Formato, duração e origem do vídeo (gravação do OBS, gravação de tela do celular, download de alguma plataforma), para facilitar reproduzir o problema.
