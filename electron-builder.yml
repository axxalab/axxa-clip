appId: com.hotclip.app
productName: HotClip
directories:
  buildResources: build
files:
  - out/**/*
  - "!**/*.map"
# ffmpeg/ffprobe/sherpa/onnxruntime native addons must run from the real filesystem, not inside asar
asarUnpack:
  - "**/node_modules/ffmpeg-static/**"
  - "**/node_modules/@ffprobe-installer/**"
  - "**/node_modules/sherpa-onnx-*/**"
  - "**/node_modules/onnxruntime-node/**"
# bundled caption font (OFL) — libass reads it via the subtitles filter's fontsdir
extraResources:
  - from: tools/qwen-speech-server.py
    to: speech/qwen-speech-server.py
  - from: resources/fonts
    to: fonts
  # web-caption overlay templates (rendered by the offscreen BrowserWindow)
  - from: resources/caption-templates
    to: caption-templates
win:
  # arch explícito: sem isto o alvo herda a arquitetura do runner, e uma troca do runner do GitHub
  # mudaria silenciosamente o que sai na release. O nome do artefato carrega o ${arch} justamente
  # para que x64 e arm64 nunca se sobrescrevam.
  target:
    - target: nsis
      arch:
        - x64
    - target: zip # versão portátil em zip, que não precisa de instalação
      arch:
        - x64
  artifactName: HotClip-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  target:
    - dmg
  artifactName: HotClip-${version}-mac-${arch}.${ext}
  category: public.app-category.video
linux:
  target:
    - AppImage
  artifactName: HotClip-${version}-linux-${arch}.${ext}
  category: Video
npmRebuild: false
