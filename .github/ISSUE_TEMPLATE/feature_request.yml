name: 💡 Sugerir um recurso / Feature Request
description: Quer um recurso novo, ou achou que algo podia ser melhor / Suggest an idea
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        As direções que já estão no planejamento (bancada de revisão, detecção de plano, templates de estilo, publicação em várias plataformas, MCP…) estão no [planejamento do produto](../blob/main/docs/PRODUCT-PLAN.md). Para votar ou só trocar ideia, vá até as [Discussions](../discussions).
  - type: textarea
    id: problem
    attributes:
      label: A situação ou o problema que você encontrou / The scenario
      description: Conte primeiro a situação e só depois a solução — que tipo de conteúdo você está cortando, e em que passo você empaca?
      placeholder: "Por exemplo: eu corto podcast de entrevista e preciso reajustar o estilo da legenda em cada clipe na mão, o que perde muito tempo…"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: O recurso que você gostaria / What you'd like
      placeholder: "Por exemplo: queria poder salvar o estilo de legenda como template e aplicar num clique nas tarefas novas"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Como você contorna isso hoje / Current workaround (opcional)
